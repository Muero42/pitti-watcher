name: pitti-watcher tests
on:
  pull_request:
  push:
    branches:
      - main
      - 'pitti-auto/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:syntax
      - run: npm test
